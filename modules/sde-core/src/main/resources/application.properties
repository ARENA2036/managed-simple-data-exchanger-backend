springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
#spring.mvc.pathmatch.matching-strategy=ant_path_matcher

#Oauth 2 configuration with keycloak
keycloak.clientid=
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# Enable multipart uploads
spring.servlet.multipart.enabled=true
spring.main.allow-bean-definition-overriding=true
spring.jackson.mapper.accept-case-insensitive-enums=true

# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB

# Max file size.
spring.servlet.multipart.max-file-size=200MB


# Max Request Size
spring.servlet.multipart.max-request-size=215MB
server.servlet.context-path=/api


## Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:/flyway


## Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.jpa.open-in-view=false

## File Storage Properties
file.upload-dir=./temp/

## Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%logger{36}] - %msg%n
logging.level.root=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.apache.http=DEBUG
logging.level.sun.rmi=WARN
logging.level.javax.management.remote.rmi=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.cloud.openfeign=DEBUG
#feign.client.config.digitalTwinsFeignClient.loggerLevel=DEBUG


## Digital Twins
digital-twins.hostname=
digital-twins.authentication.url=
digital-twins.registry.uri=/api/v3
digital-twins.registry.lookup.uri=/api/v3
digital-twins.authentication.enable=false
digital-twins.authentication.clientId=
digital-twins.authentication.clientSecret=
digital-twins.authentication.grantType=
digital-twins.authentication.scope=

#General EDC Configutation
edc.version.major=0
edc.version.minor=11
edc.version.nano=1
edc.asset.prop.common.version=3.0
## EDC Provider
edc.hostname=
edc.managementpath=/management
edc.apiKeyHeader=X-Api-Key
edc.apiKey=
edc.dsp.endpointpath=/api/v1/dsp
edc.dataplane.hostname=
edc.dataplane.endpointpath=/api/public
edc.managementpath.apiversion=/v3
edc.managementpath.apiversion.asset=/v3
## needs to be empty because cx-policy context is causing issues
## edc.policy.prefix=

## EDC Consumer
edc.consumer.hostname=
edc.consumer.apikeyheader=X-Api-Key
edc.consumer.apikey=
##edc.consumer.managementpath=/data/v2
edc.consumer.managementpath=/management
edc.consumer.protocol.path=/api/v1/dsp

## DFT configuration for EDC
dft.hostname=
dft.apiKeyHeader=
dft.apiKey=
## Submodel data source configuration for EDC
##rename to submodel.datasource.external
submodel.datasource.enable=true
submodel.datasource.hostname=
submodel.datasource.authentication.enable=false
submodel.datasource.clientId=
submodel.datasource.clientSecret=
submodel.datasource.grantType=client_credentials

#EDR Configuration
edr.retry.count=5
edr.retry.time=1500
edr.refresh.auto=true
edr.refresh.enable=false
## Manufacturer Id
manufacturerId=


##Partner Pool Api Host
partner.pool.hostname=
partner.pool.authentication.url=
partner.pool.clientId=
partner.pool.clientSecret=
partner.pool.grantType=client_credentials
#bpdm.provider.edc.dataspace.api=abc
#bpdm.provider.edc.public.api=def

#BPDM
bpdm.provider.edc.dsp.api=
bpdm.provider.bpnl=
#bpdm.provider.edc.public.api==


## Portal backend and Connector discovery
portal.backend.hostname=
portal.backend.authentication.url=
##portal.backend.authentication.url=default
portal.backend.clientId=
portal.backend.clientSecret=
portal.backend.grantType=client_credentials

## bpn & discovery finder
bpndiscovery.hostname=
discovery.authentication.url=
discovery.clientId=
discovery.clientSecret=
discovery.grantType=client_credentials


# policy-hub config
policy.hub.hostname=
policy.hub.authentication.url=
policy.hub.clientId=
policy.hub.clientSecret=
policy.hub.grantType=client_credentials

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
spring.sleuth.sampler.probability=1.0
spring.zipkin.base-url=http://localhost:9411/
spring.zipkin.sender.type=web
spring.application.name=springboot-monitoring-SDE

spring.cloud.openfeign.client.config.EDRApiProxy.connect-timeout=1500
spring.cloud.openfeign.client.config.EDRApiProxy.read-timeout=3000