# Local profile: SDE against the Construct-X docker testbed.
# See local/construct-x/README.md. Only local, non-secret testbed values here.
# Activate with spring.profiles.active=constructx

sde.dataspace.profile=constructx

## Login (unchanged: users still log in via CX-Central)
keycloak.clientid=SDE-1
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://centralidp.txcd.arena2036-x.de/auth/realms/CX-Central

## SDE database (sde-postgres from docker-compose.sde-addons.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5433/sdedb
spring.datasource.username=postgres
spring.datasource.password=admin

## Our identity in the Construct-X testbed (DID instead of BPN)
manufacturerId=did:web:provider-wallet:user:provider
bpdm.provider.bpnl=did:web:provider-wallet:user:provider

## Provider EDC: one hostname for both ports.
## Management (from SDE on the host) -> :39010, DSP (from the consumer EDC in Docker) -> :9020
edc.version.minor=13
edc.hostname=http://provider-controlplane
edc.managementpath=:39010/management
edc.apiKeyHeader=x-api-key
edc.apiKey=prov-management-api-key
edc.dsp.endpointpath=:9020/dsp
edc.dataplane.hostname=http://provider-dataplane:9500
edc.dataplane.endpointpath=/public
## Construct-X has no Catena-X JSON-LD contexts
edc.policy.prefix=
bpdm.provider.edc.dsp.api=http://provider-controlplane:9020/dsp

## Consumer EDC
edc.consumer.hostname=http://consumer-controlplane
edc.consumer.managementpath=:29010/management
edc.consumer.apikeyheader=x-api-key
edc.consumer.apikey=cons-management-api-key
edc.consumer.protocol.path=/dsp

## Digital Twin Registry (sde-dtr, no auth: empty token URL = no Authorization header)
digital-twins.hostname=http://sde-dtr:4243
digital-twins.authentication.url=
digital-twins.authentication.clientId=none
digital-twins.authentication.clientSecret=none
digital-twins.authentication.grantType=client_credentials

## Submodel server (sde-submodel)
submodel.datasource.hostname=http://sde-submodel:8090/data

## Central Catena-X services do not exist in Construct-X; placeholders keep startup happy
partner.pool.hostname=default
portal.backend.hostname=http://localhost
bpndiscovery.hostname=http://localhost
policy.hub.hostname=http://localhost

## Construct-X partners (no Portal / BPN Discovery): DID -> DSP endpoint
sde.constructx.partners[0].id=did:web:provider-wallet:user:provider
sde.constructx.partners[0].name=Testbed provider
sde.constructx.partners[0].dsp-url=http://provider-controlplane:9020/dsp
