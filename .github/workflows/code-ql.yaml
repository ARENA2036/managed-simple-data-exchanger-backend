name: "CodeQL"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  schedule:
    - cron: "0 0 * * 0"
  workflow_call:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["java"] # Define languages here
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'maven'

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@181d5eefc20863364f96762470ba6f862bdef56b # v2.227
        with:
          languages: ${{ matrix.language }}
          build-mode: manual

          # If you wish to specify custom queries, you can do so here or in a config file
          # By default, queries listed here will override any specified in a config file
          # Prefix the list here with "+" to use these queries and those in the config file

          # For more details on CodeQL's query packs, refer to:
          # https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # Use +security-extended,security-and-quality for wider security and better code quality
          queries: +security-extended,security-and-quality

      # Build the Java project manually because CodeQL autobuild cannot
      # resolve the Maven project automatically.
      - name: Build application with Maven
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "./mvnw" ]]; then
            echo "Building with Maven Wrapper"

            chmod +x ./mvnw

            ./mvnw \
              --batch-mode \
              --show-version \
              --errors \
              --no-transfer-progress \
              clean package \
              -DskipTests

          elif [[ -f "./pom.xml" ]]; then
            echo "Building with system Maven"

            mvn \
              --batch-mode \
              --show-version \
              --errors \
              --no-transfer-progress \
              clean package \
              -DskipTests

          else
            echo "Maven project was not found"
            echo "Expected ./mvnw or ./pom.xml"
            exit 1
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@181d5eefc20863364f96762470ba6f862bdef56b # v2.227
        with:
          category: "/language:${{ matrix.language }}"
          fail-on: error